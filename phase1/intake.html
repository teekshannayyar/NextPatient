<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextPatient - Receptionist Intake</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-body">

    <div class="dashboard-layout">

        <!-- ══ SIDEBAR ══ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🏥 NextPatient</h2>
                <p>Receptionist</p>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active">📝 Intake Form</a>
                <a href="contact.html">💬 Contact Admin</a>
                <a href="#" onclick="handleLogout()" class="logout-btn">🚪 Logout</a>
            </nav>
        </aside>

        <!-- ══ MAIN CONTENT ══ -->
        <main class="main-content">
            
            <header class="topbar">
                <h1 id="pageTitle" style="color:var(--text);">Patient Registration</h1>
                <div class="user-profile">Receptionist</div>
            </header>

            <section class="dashboard-section" style="display:block;">
                <div class="workspace-grid" style="grid-template-columns: 1fr 350px;">
                    
                    <!-- Left Column: Intake Form -->
                    <div class="workspace-card">
                        <div class="workspace-card-header">
                            <span>📋 New Patient Details</span>
                        </div>
                        <div class="workspace-card-body">
                            <form id="intakeForm" class="intake-form" onsubmit="handleFormsubmit(event)">
                                
                                <div class="form-section-title">Personal Information</div>
                                <div class="form-row-grid">
                                    <div class="input-group">
                                        <label for="name">Full Name</label>
                                        <input type="text" id="name" placeholder="Ajay Sharma" required>
                                    </div>
                                    <div class="input-group">
                                        <label for="age">Age</label>
                                        <input type="number" id="age" placeholder="35" min="1" max="120" required>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label for="phone">Phone Number (10 Digits)</label>
                                    <input type="tel" id="phone" placeholder="1234567890" pattern="[0-9]{10}" required>
                                </div>

                                <div class="form-section-title" style="margin-top:1.5rem;">Vitals & Duration</div>
                                <div class="form-row-grid">
                                    <div class="input-group">
                                        <label>Pain Severity: <span id="painValue" style="color:var(--primary); font-weight:700;">1</span>/5</label>
                                        <input type="range" id="PainSeverity" class="styled-slider" min="1" max="5" value="1">
                                    </div>
                                    <div class="input-group">
                                        <label>Breathing Diff: <span id="breathingValue" style="color:var(--primary); font-weight:700;">1</span>/5</label>
                                        <input type="range" id="BreathingDifficulty" class="styled-slider" min="1" max="5" value="1">
                                    </div>
                                </div>
                                <div class="input-group" style="margin-top:0.5rem;">
                                    <label>Symptom Duration</label>
                                    <select id="symptomDuration" class="styled-select">
                                        <option value="acute">Acute (Under 24 hours)</option>
                                        <option value="short_term">Short-term (1-3 days)</option>
                                        <option value="medium_term">Medium-term (4-7 days)</option>
                                        <option value="chronic">Chronic (More than a week)</option>
                                    </select>
                                </div>

                                <div class="form-section-title" style="margin-top:1.5rem;">Reported Symptoms</div>
                                <div class="symptom-grid">
                                    <label class="symptom-checkbox-card">
                                        <input type="checkbox" id="fever">
                                        <span class="sc-content">🌡️ Fever</span>
                                    </label>
                                    <label class="symptom-checkbox-card">
                                        <input type="checkbox" id="fainting">
                                        <span class="sc-content">😵 Fainting</span>
                                    </label>
                                    <label class="symptom-checkbox-card">
                                        <input type="checkbox" id="chestPain">
                                        <span class="sc-content">💔 Chest Pain</span>
                                    </label>
                                    <label class="symptom-checkbox-card">
                                        <input type="checkbox" id="bleeding">
                                        <span class="sc-content">🩸 Bleeding</span>
                                    </label>
                                    <label class="symptom-checkbox-card">
                                        <input type="checkbox" id="vomiting">
                                        <span class="sc-content">🤢 Vomiting</span>
                                    </label>
                                    <label class="symptom-checkbox-card">
                                        <input type="checkbox" id="dizziness">
                                        <span class="sc-content">🌀 Dizziness</span>
                                    </label>
                                </div>

                                <button type="submit" class="submit-intake-btn" style="margin-top:2rem; width:100%; font-size:1.1rem; padding:1rem;">
                                    Add Patient to Queue ➡️
                                </button>

                            </form>
                        </div>
                    </div>

                    <!-- Right Column: Live Queue -->
                    <div class="workspace-card" style="display:flex; flex-direction:column; max-height: 85vh;">
                        <div class="workspace-card-header" style="background:#fee2e2; border-bottom:1px solid #fca5a5;">
                            <span style="color:#b91c1c;">🚨 Now Serving</span>
                        </div>
                        <div id="now_serving" style="padding:1rem; text-align:center; background:#fef2f2; border-bottom:1px solid #fecaca; font-weight:700; color:#991b1b;">
                            Loading...
                        </div>
                        
                        <div class="workspace-card-header" style="border-top:1px solid var(--border);">
                            <span>⏳ Live Waiting Queue</span>
                        </div>
                        <div class="workspace-card-body queue-list-container" style="overflow-y:auto; flex:1; padding:1rem;">
                            <div id="queue_container" class="modern-queue-list"></div>
                        </div>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="intake.js"></script>
    <script>
        requireRole("receptionist");
    </script>

</body>
</html>
