<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextPatient - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>NextPatient Login</h1>

    <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button type="button" onclick="handleLogin()">Log In</button>
    </form>

    <p id="loginError" style="display:none; color:red;">Invalid username or password.</p>

    <p><a href="signup.html">First time? Create an admin account</a></p>

    <script src="triage.js"></script>
    <script src="auth.js"></script>

</body>

</html>
